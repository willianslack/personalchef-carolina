databases:
  - name: personalchef-carolina-db
    plan: basic-256mb
    databaseName: personalchef_carolina
    user: personalchef_carolina

services:
  - type: web
    name: personalchef-carolina
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personalchef-carolina-db
          property: connectionString
      - key: ADMIN_USER
        value: carolina
      - key: ADMIN_PASSWORD
        sync: false
